# Hugo configuration file
title: 4D Perception Lab

# Pagination settings
paginate: 8
paginatePath: page

# import hextra as module
module:
  imports:
  - path: github.com/imfing/hextra
  - path: github.com/hugomods/icons/vendors/font-awesome

markup:
  # allow raw html
  goldmark:
    renderer:
      unsafe: true

  # enable hextra syntax highlight
  highlight:
    noClasses: false

menu:
  main:
    - name: Home
      pageRef: /
      weight: 1
    - name: Research
      pageRef: /research
      weight: 2
    - name: News
      pageRef: /news
      weight: 3
    - name: People
      pageRef: /people
      weight: 4
    - name: Expertise
      pageRef: /expertise
      weight: 5
    - name: Contact
      pageRef: /contact
      weight: 6
    - name: Search
      weight: 7
      params:
        type: search

params:
  navbar:
    displayTitle: true
    displayLogo: false

  footer:
    displayCopyright: false
    displayPoweredBy: false

  editURL:
    enable: false
    base: "https://github.com/imfing/hextra-starter-template/edit/main/content"


params:
  images:
    - logo-social-preview.png
  theme:
    # light | dark | system
    default: light
    displayToggle: true
  navbar:
    displayTitle: true
    displayLogo: true
    logo:
      # path: images/logo light 128x128.png 
      # dark: images/logo dark 128x128.png
      path: favicon.svg
      dark: favicon-dark.svg
      link: /
      # The new logo is roughly 3:1, so give it a wide navbar footprint
      # while retaining the existing 40 px navbar height.
      width: 122
      height: 40
      params:
  page:
    # full (100%), wide (90rem), normal (1280px)
    width: wide

  copyright: ""
